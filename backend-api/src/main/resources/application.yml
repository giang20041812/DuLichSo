spring:
  application:
    name: booking-api
  
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:dulichso}?useSSL=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&sessionVariables=sql_require_primary_key=0}
    username: ${DB_USERNAME:${MYSQL_USER:root}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:giang2004}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: localhost
      port: 6379

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # SMTP gửi OTP quên mật khẩu. Gmail: dùng App Password 16 ký tự (không dùng mật khẩu đăng nhập).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  cors:
    # Origin của frontend, cách nhau bởi dấu phẩy. KHÔNG dùng * (AGENTS.md).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://du-lich-so-o5a9-jx5r27akq-du-lich-so.vercel.app}
  # Tài khoản mẫu QA (admin@taybactrails.vn / ncc@taybactrails.vn...) — CHỈ bật khi dev. Production phải để false.
  qa-mock-accounts: ${APP_QA_MOCK_ACCOUNTS:false}
  mail:
    # Địa chỉ người gửi hiển thị; mặc định = MAIL_USERNAME
    from: ${MAIL_FROM:}
  password-reset:
    otp-ttl-minutes: ${PASSWORD_RESET_OTP_TTL_MINUTES:10}
    max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
    cooldown-seconds: ${PASSWORD_RESET_COOLDOWN_SECONDS:60}
    max-per-hour: ${PASSWORD_RESET_MAX_PER_HOUR:5}
    # CHỈ bật khi dev để in OTP ra log. Production phải để false.
    log-otp: ${PASSWORD_RESET_LOG_OTP:false}
  feature-flags:
    enable-online-payment: true
    enable-redirect-booking: true
    enable-carpool: false
  media:
    active-provider: ${ACTIVE_MEDIA_PROVIDER:CLOUDINARY}
  
gemini:
  api-key: ${GEMINI_API_KEY:your_default_key}

cloudflare:
  account-id: ${CLOUDFLARE_ACCOUNT_ID:your_default_account_id}
  api-token: ${CLOUDFLARE_API_TOKEN:your_default_api_token}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:your_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:dulichso-6ac41}

jwt:
  secret: ${JWT_SECRET:dulichso-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
