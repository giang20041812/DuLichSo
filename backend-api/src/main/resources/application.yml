spring:
  application:
    name: booking-api
  
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:dulichso}?useSSL=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&sessionVariables=sql_require_primary_key=0}
    username: ${DB_USERNAME:${MYSQL_USER:root}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:giang2004}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Giữ tối đa 20 connection trong pool, tránh cạn khi có nhiều booking đồng thời
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      # Fail nhanh (10s) thay vì treo 30s khi pool cạn — người dùng nhận lỗi rõ ràng hơn
      connection-timeout: ${HIKARI_CONN_TIMEOUT:10000}
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # SMTP gửi OTP quên mật khẩu. Gmail: dùng App Password 16 ký tự (không dùng mật khẩu đăng nhập).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  cors:
    # Origin của frontend, cách nhau bởi dấu phẩy. KHÔNG dùng * (AGENTS.md).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://du-lich-so-o5a9-jx5r27akq-du-lich-so.vercel.app}
  # Tài khoản mẫu QA (admin@taybactrails.vn / ncc@taybactrails.vn...) — CHỈ bật khi dev. Production phải để false.
  qa-mock-accounts: ${APP_QA_MOCK_ACCOUNTS:false}
  # NFR-PRI-02: thời hạn lưu giữ dữ liệu theo từng loại; job dọn chạy mỗi ngày. Booking/đánh giá/tài khoản không tự xóa.
  retention:
    enabled: ${RETENTION_ENABLED:true}
    audit-log-days: ${RETENTION_AUDIT_LOG_DAYS:180}
    password-reset-token-days: ${RETENTION_RESET_TOKEN_DAYS:7}
    notification-days: ${RETENTION_NOTIFICATION_DAYS:90}
    cron: ${RETENTION_CRON:0 30 3 * * *}
  security:
    # NFR-SEC-03: Admin/NCC không hoạt động quá số phút này thì phiên hết hiệu lực (tài liệu tham khảo 30 phút).
    idle-timeout-minutes: ${SESSION_IDLE_TIMEOUT_MINUTES:30}
  mail:
    # Địa chỉ người gửi hiển thị; mặc định = MAIL_USERNAME
    from: ${MAIL_FROM:}
  password-reset:
    otp-ttl-minutes: ${PASSWORD_RESET_OTP_TTL_MINUTES:10}
    max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
    cooldown-seconds: ${PASSWORD_RESET_COOLDOWN_SECONDS:60}
    max-per-hour: ${PASSWORD_RESET_MAX_PER_HOUR:5}
    # CHỈ bật khi dev để in OTP ra log. Production phải để false.
    log-otp: ${PASSWORD_RESET_LOG_OTP:false}
  feature-flags:
    enable-online-payment: true
    enable-redirect-booking: true
    enable-carpool: false
  media:
    active-provider: ${ACTIVE_MEDIA_PROVIDER:CLOUDINARY}
  
gemini:
  api-key: ${GEMINI_API_KEY:your_default_key}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:kttdfqzj}
  api-key: ${CLOUDINARY_API_KEY:161718743596393}
  api-secret: ${CLOUDINARY_API_SECRET:eqw1pQdh4LlhiqbX_6im1QAHfi0}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:dulichso-6ac41}

jwt:
  secret: ${JWT_SECRET:dulichso-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}
